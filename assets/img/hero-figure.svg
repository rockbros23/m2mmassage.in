<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Abstract study of a seated male figure in warm gold light</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1710"/>
      <stop offset=".45" stop-color="#12100c"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".32" r=".62">
      <stop offset="0" stop-color="#d4af6a" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#b18a45" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e7c2"/>
      <stop offset=".5" stop-color="#d4af6a"/>
      <stop offset="1" stop-color="#8f6b2e"/>
    </linearGradient>
    <linearGradient id="body" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#2a2318"/>
      <stop offset=".42" stop-color="#171410"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2=".4">
      <stop offset="0" stop-color="#f0d9a8" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#d4af6a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#d4af6a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#08080a" stop-opacity="0"/>
      <stop offset="1" stop-color="#08080a" stop-opacity=".85"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <circle cx="300" cy="290" r="260" fill="url(#glow)"/>
  <ellipse cx="300" cy="255" rx="150" ry="190" fill="#d4af6a" opacity=".08" filter="url(#soft2)"/>

  <!-- concentric architecture -->
  <g fill="none" stroke="url(#gold)">
    <circle cx="300" cy="300" r="252" opacity=".16"/>
    <circle cx="300" cy="300" r="288" opacity=".07"/>
    <circle cx="300" cy="300" r="214" opacity=".1" stroke-dasharray="2 10"/>
    <path d="M48 300a252 252 0 0 1 504 0" opacity=".05"/>
  </g>

  <!-- dots on ring -->
  <g fill="#d4af6a">
    <circle cx="300" cy="48" r="2.4" opacity=".8"/>
    <circle cx="548" cy="300" r="2" opacity=".45"/>
    <circle cx="52" cy="300" r="2" opacity=".45"/>
    <circle cx="300" cy="552" r="1.6" opacity=".25"/>
  </g>

  <!-- botanical branches -->
  <g fill="none" stroke="url(#gold)" stroke-width="1" opacity=".38">
    <path d="M78 664c18-78 22-146 10-214"/>
    <path d="M86 566c-22-10-36-30-38-56 24 2 42 18 46 44"/>
    <path d="M90 524c-2-24 8-46 28-60 6 22-2 44-20 58"/>
    <path d="M84 604c-20-6-34-22-38-44 20 0 36 14 42 34"/>
    <path d="M522 132c-16 60-18 118-8 176"/>
    <path d="M514 218c18 8 30 26 30 48-20-2-34-16-36-38"/>
    <path d="M512 254c2 20-6 38-22 50-4-18 2-36 16-48"/>
    <path d="M518 186c16 4 28 18 30 36-18 0-30-12-34-28"/>
  </g>

  <!-- figure silhouette -->
  <g>
    <path d="M300 120c-38 0-64 28-64 66 0 27 14 49 36 59-14 6-26 13-38 22-16 12-38 24-56 41-30 29-48 72-54 122-6 50 0 110 10 170v60h332v-60c10-60 16-120 10-170-6-50-24-93-54-122-18-17-40-29-56-41-12-9-24-16-38-22 22-10 36-32 36-59 0-38-26-66-64-66Z"
          fill="url(#body)" stroke="#d4af6a" stroke-opacity=".28" stroke-width="1.1"/>
    <!-- rim light -->
    <path d="M300 120c-38 0-64 28-64 66 0 27 14 49 36 59-14 6-26 13-38 22-16 12-38 24-56 41-30 29-48 72-54 122"
          fill="none" stroke="url(#rim)" stroke-width="1.8" stroke-linecap="round"/>
    <!-- contour lines of the back -->
    <g fill="none" stroke="url(#gold)" stroke-linecap="round">
      <path d="M280 250c6 8 14 12 20 12s14-4 20-12" opacity=".3"/>
      <path d="M300 304c-4 96 8 200 4 316" stroke-width="1" opacity=".16"/>
      <path d="M192 358c34 26 70 42 108 42s74-16 108-42" stroke-width="1.1" opacity=".22"/>
      <path d="M174 432c38 28 80 44 126 44s88-16 126-44" stroke-width="1" opacity=".16"/>
      <path d="M160 508c44 32 92 48 140 48s96-16 140-48" stroke-width="1" opacity=".12"/>
      <path d="M150 582c48 34 98 50 150 50s102-16 150-50" stroke-width="1" opacity=".09"/>
      <!-- shoulder blade definition -->
      <path d="M228 330c-10 30-8 60 6 84 16 26 44 40 66 40" opacity=".18"/>
      <path d="M372 330c10 30 8 60-6 84-16 26-44 40-66 40" opacity=".18"/>
      <!-- arms -->
      <path d="M176 380c-16 44-22 92-20 144 2 52 12 96 24 136" opacity=".14"/>
      <path d="M424 380c16 44 22 92 20 144-2 52-12 96-24 136" opacity=".14"/>
    </g>
    <!-- warm highlight streak -->
    <path d="M262 300c10 60 14 130 10 200-4 62-12 118-18 160" fill="none" stroke="#f0d9a8" stroke-opacity=".06" stroke-width="22" filter="url(#soft)"/>
  </g>

  <!-- floating accents -->
  <g fill="none" stroke="url(#gold)">
    <path d="M104 210c34-34 72-50 114-48" opacity=".18"/>
    <path d="M112 222c30-30 64-44 102-42" opacity=".1"/>
    <circle cx="104" cy="210" r="2.4" fill="#d4af6a" stroke="none" opacity=".8"/>
    <path d="M492 470c-24 26-52 38-84 38" opacity=".16"/>
    <circle cx="492" cy="470" r="2" fill="#d4af6a" stroke="none" opacity=".6"/>
  </g>

  <rect y="560" width="600" height="190" fill="url(#fade)"/>
</svg>
